name: Final Build Validation

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate:
    name: Validate And Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew

      - name: Show project structure
        shell: bash
        run: |
          set -euo pipefail

          echo "===== ROOT FILES ====="
          ls -la

          echo "===== WORKFLOWS ====="
          find .github/workflows -maxdepth 1 -type f | sort || true

          echo "===== ANDROID APP SOURCE ====="
          find androidApp/src -type f | sort

          echo "===== COMPOSE APP TOP-LEVEL SOURCE ====="
          find composeApp/src/commonMain/kotlin -maxdepth 4 -type f -name '*.kt' | sort | head -40
          find composeApp/src/androidMain/kotlin -maxdepth 4 -type f -name '*.kt' | sort

      - name: Validate required files
        shell: bash
        run: |
          set -euo pipefail

          REQUIRED_FILES=(
            "settings.gradle.kts"
            "build.gradle.kts"
            "gradle.properties"
            "gradlew"
            "androidApp/build.gradle.kts"
            "androidApp/src/main/AndroidManifest.xml"
            "androidApp/src/main/kotlin/com/inspiredandroid/pocketclaw/MainActivity.kt"
            "androidApp/src/main/kotlin/com/inspiredandroid/pocketclaw/PocketClawApplication.kt"
            "composeApp/build.gradle.kts"
            "composeApp/src/commonMain/kotlin/com/inspiredandroid/pocketclaw/App.kt"
            "composeApp/src/commonMain/kotlin/com/inspiredandroid/pocketclaw/AppModule.kt"
            "composeApp/src/commonMain/kotlin/com/inspiredandroid/pocketclaw/Platform.kt"
            "composeApp/src/commonMain/kotlin/com/inspiredandroid/pocketclaw/data/AppSettings.kt"
            "composeApp/src/commonMain/kotlin/com/inspiredandroid/pocketclaw/data/DataRepository.kt"
            "composeApp/src/commonMain/composeResources/values/strings.xml"
          )

          missing=0

          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$file" ]; then
              echo "MISSING: $file"
              missing=1
            else
              echo "OK: $file"
            fi
          done

          if [ "$missing" -eq 1 ]; then
            echo "Validation failed: missing required files."
            exit 1
          fi

          echo "All required files exist."

      - name: Run Gradle project validation
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew projects --stacktrace --console=plain 2>&1 | tee gradle-projects-log.txt

      - name: Run Gradle dependency insight
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :androidApp:dependencies --configuration fossDebugRuntimeClasspath --console=plain 2>&1 | tee gradle-dependencies-log.txt

      - name: Build Foss Debug APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew clean :androidApp:assembleFossDebug --stacktrace --info --console=plain --warning-mode=all 2>&1 | tee build-log.txt

      - name: Verify APK exists
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="androidApp/build/outputs/apk/foss/debug"

          if [ ! -d "$APK_DIR" ]; then
            echo "APK directory does not exist: $APK_DIR"
            echo "Contents of androidApp/build/outputs:"
            find androidApp/build/outputs -maxdepth 5 -type f 2>/dev/null | sort || true
            exit 1
          fi

          APK_COUNT=$(find "$APK_DIR" -name "*.apk" | wc -l | tr -d ' ')

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "No APK was produced."
            echo "Contents of androidApp/build/outputs:"
            find androidApp/build/outputs -maxdepth 5 -type f | sort || true
            exit 1
          fi

          echo "APK files found:"
          find "$APK_DIR" -name "*.apk" -print

      - name: Create validation summary
        if: always()
        shell: bash
        run: |
          {
            echo "# PocketClaw Final Validation"
            echo
            echo "## Project"
            echo "- Application id: com.inspiredandroid.pocketclaw"
            echo "- Modules: :androidApp, :composeApp"
            echo "- Stack: Kotlin Multiplatform, Jetpack Compose, Material 3, Koin"
            echo "- Target: Android only (foss flavor)"
            echo
            echo "## APK Output"
            echo "\`\`\`text"
            find androidApp/build/outputs/apk -type f -name "*.apk" 2>/dev/null || true
            echo "\`\`\`"
            echo
            echo "## Source File Counts"
            echo "\`\`\`text"
            echo -n "androidApp .kt files: "
            find androidApp/src -type f -name '*.kt' | wc -l
            echo -n "composeApp commonMain .kt files: "
            find composeApp/src/commonMain/kotlin -type f -name '*.kt' | wc -l
            echo -n "composeApp androidMain .kt files: "
            find composeApp/src/androidMain/kotlin -type f -name '*.kt' | wc -l
            echo "\`\`\`"
          } > VALIDATION_SUMMARY.md

      - name: Upload validation logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-validation-logs
          path: |
            build-log.txt
            gradle-projects-log.txt
            gradle-dependencies-log.txt
            VALIDATION_SUMMARY.md
            **/build/reports/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload final APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: pocketclaw-foss-debug-apk
          path: androidApp/build/outputs/apk/foss/debug/*.apk
          if-no-files-found: error
