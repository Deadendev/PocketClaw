name: Android Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Assemble Android Debug
    runs-on: ubuntu-latest
    if: |
      !contains(github.event.head_commit.message, '[skip ci]') &&
      github.actor != 'github-actions[bot]'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set execution flag for gradlew
        run: chmod +x gradlew

      - name: Prepare gradle log directory
        run: mkdir -p gradle-logs

      - name: Run spotlessApply
        shell: bash
        run: |
          set -o pipefail
          ./gradlew spotlessApply --no-daemon --stacktrace --console=plain --warning-mode=all 2>&1 | tee gradle-logs/spotless.log

      - name: Assemble Foss Debug APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :androidApp:assembleFossDebug --no-daemon --stacktrace --console=plain --warning-mode=all 2>&1 | tee gradle-logs/assemble-foss-debug.log

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PocketClaw-foss-debug-${{ github.sha }}
          path: androidApp/build/outputs/apk/foss/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.sha }}
          path: |
            gradle-logs/
            **/build/reports/
            **/build/outputs/logs/
            **/build/kotlin/
            **/build/tmp/kotlin-classes/*.txt
          if-no-files-found: ignore
          retention-days: 14
