name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  apk:
    name: Generate APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set execution flag for gradlew
        run: chmod +x gradlew
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android Build Tools
        run: |
          sdkmanager "build-tools;36.0.0"
          sdkmanager "build-tools;29.0.3"
      - name: Prepare build log directory
        run: mkdir -p build-logs
      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          bash ./gradlew :androidApp:assembleFossRelease --stacktrace --console=plain --warning-mode=all 2>&1 | tee build-logs/assemble-foss-release.log
      - name: Sign APK
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: androidApp/build/outputs/apk/foss/release
          signingKeyBase64: ${{ secrets.KEYSTORE_B64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEYSTORE_PASSWORD }}
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: signed-apk
          path: androidApp/build/outputs/apk/foss/release/androidApp-foss-release-signed.apk

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-build-logs
          path: |
            build-logs/
            **/build/reports/
            **/build/outputs/logs/
            **/build/kotlin/
            **/build/tmp/kotlin-classes/*.txt
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: Release APK
    needs: [apk]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Download APK Artifact
        uses: actions/download-artifact@v4.1.7
        with:
          name: signed-apk

      - name: Rename asset
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mv androidApp-foss-release-signed.apk "PocketClaw-${VERSION}-android.apk"

      - name: Create Github Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          files: PocketClaw-*
